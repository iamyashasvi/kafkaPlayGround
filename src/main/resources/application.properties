
server.port=8081
spring.application.name=kafkaPlayGround


#Both broker listed out here, if one is down then producer will connect with other broker.
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093

#Meta-data refresh interval: how often producer will fetch cluster metadata information.
spring.kafka.producer.properties.metadata.max.age.ms=30000

#Asking broker to reply acknowledge when all member from the ISR list sent acknowledge
spring.kafka.producer.acks=all

#------------------SERIALISER------------------
#key needs to be string
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

#value: JsonSerializer auto-converts Java objects to JSON bytes
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#-------------------RECORD ACCUMULATOR------------
#Batching, wait for 20ms to collection more batches.
spring.kafka.producer.properties.linger.ms=20

#Max Batch Size ==> send when batch reaches to 32KB(even if linger.ms hasn't expired)
spring.kafka.producer.properties.batch.size=32768

#Total memory for all batches: 32MB (if full, send will get blocked till space created or max block time)
spring.kafka.producer.properties.buffer.memory=33554432

# Max time send() blocks if buffer is full (default 60s), after this time, send() call will fail immediately
spring.kafka.producer.properties.max.block.ms=60000


#---------------COMPRESSION-------
# compresses entire batch before sending
spring.kafka.producer.properties.compression.type=snappy


#---------------SENDER THREAD-------
# Retry on transient failures (network timeout, leader change, etc.)
spring.kafka.producer.retries=3

# Max in-flight requests
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5